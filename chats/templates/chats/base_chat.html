<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Чат{% endblock %} | Донн Поддонн</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
    <style>
        /* Custom scrollbar */
        textarea::-webkit-scrollbar,
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }
        
        textarea::-webkit-scrollbar-track,
        .messages-container::-webkit-scrollbar-track {
            background: #1e1e22;
            border-radius: 4px;
        }
        
        textarea::-webkit-scrollbar-thumb,
        .messages-container::-webkit-scrollbar-thumb {
            background: #3a3a40;
            border-radius: 4px;
        }
        
        textarea::-webkit-scrollbar-thumb:hover,
        .messages-container::-webkit-scrollbar-thumb:hover {
            background: #4a4a50;
        }
        
        /* Firefox scrollbar */
        textarea,
        .messages-container {
            scrollbar-width: thin;
            scrollbar-color: #3a3a40 #1e1e22;
        }
    </style>
</head>
<body style="background: #1e1e22; color: #e4e4e7; min-height: 100vh; display: flex; flex-direction: column;">
    {% include 'core/includes/navbar.html' %}

    <!-- Алерты скрыты для чатов -->

    <div class="content-wrapper">
        {% block chat_content %}{% endblock %}
    </div>

    {% include 'core/includes/footer.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
